services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?Set TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - web
    restart: unless-stopped

  app:
    image: ${GRIDLOOK_APP_IMAGE:-ghcr.io/leifdenby/gridlook/gridlook-app:latest}
    # Optional: uncomment to override runtime-config.js from host without rebuild
    volumes:
      - ./public/runtime-config.prod.js:/usr/share/nginx/html/runtime-config.js:ro
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # The app is built with relative asset URLs ("./..."). Without a trailing
      # slash, "/dini" resolves assets from "/" and breaks CSS/JS loading.
      - traefik.http.routers.gridlook-slash.rule=Host(`dmidev.org`) && Path(`/dini`)
      - traefik.http.routers.gridlook-slash.entrypoints=websecure
      - traefik.http.routers.gridlook-slash.tls=true
      - traefik.http.routers.gridlook-slash.tls.certresolver=letsencrypt
      - traefik.http.routers.gridlook-slash.middlewares=gridlook-add-slash
      - traefik.http.routers.gridlook-slash.priority=200
      - traefik.http.middlewares.gridlook-add-slash.redirectregex.regex=^https?://([^/]+)/dini$
      - traefik.http.middlewares.gridlook-add-slash.redirectregex.replacement=https://$${1}/dini/
      - traefik.http.middlewares.gridlook-add-slash.redirectregex.permanent=true
      - traefik.http.routers.gridlook.rule=Host(`dmidev.org`) && PathPrefix(`/dini/`)
      - traefik.http.routers.gridlook.entrypoints=websecure
      - traefik.http.routers.gridlook.tls=true
      - traefik.http.routers.gridlook.tls.certresolver=letsencrypt
      - traefik.http.routers.gridlook.priority=100
      - traefik.http.routers.gridlook.service=gridlook
      - traefik.http.services.gridlook.loadbalancer.server.port=80
      - traefik.http.routers.gridlook.middlewares=gridlook-strip-dini
      - traefik.http.middlewares.gridlook-strip-dini.stripprefix.prefixes=/dini
      - traefik.http.middlewares.gridlook-strip-dini.stripprefix.forceslash=false
    networks:
      - web
    restart: unless-stopped

volumes:
  letsencrypt:

networks:
  web:
