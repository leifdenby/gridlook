services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Optional: uncomment to override runtime-config.js from host without rebuild
    # volumes:
    #   - ./public/runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro
    ports:
      - "8080:80"
    expose:
      - "80"
    restart: unless-stopped

  dev:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - "3000:3000"
    networks:
      - default
    tty: true
    stdin_open: true

volumes:
  node_modules:
