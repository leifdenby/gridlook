services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GRIDLOOK_DEFAULT_DATASET_PATH: ${GRIDLOOK_DEFAULT_DATASET_PATH:-static/index_mr_dpp0066.json}
      GRIDLOOK_DEFAULT_VARIABLE_NAME: ${GRIDLOOK_DEFAULT_VARIABLE_NAME:-}
    volumes:
      # Optional host-provided resolver scripts served by nginx at /runtime-resolver/*
      - ./runtime-resolver:/usr/share/nginx/html/runtime-resolver:ro
    ports:
      - "8080:80"
    expose:
      - "80"
    restart: unless-stopped

  dev:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      GRIDLOOK_DEFAULT_DATASET_PATH: ${GRIDLOOK_DEFAULT_DATASET_PATH:-static/index_mr_dpp0066.json}
      GRIDLOOK_DEFAULT_VARIABLE_NAME: ${GRIDLOOK_DEFAULT_VARIABLE_NAME:-}
    volumes:
      - .:/workspace
      # Optional host-provided resolver scripts available to Vite at /runtime-resolver/*
      - ./runtime-resolver:/workspace/public/runtime-resolver:ro
      - node_modules:/workspace/node_modules
    ports:
      - "3000:3000"
    networks:
      - default
    tty: true
    stdin_open: true

volumes:
  node_modules:
